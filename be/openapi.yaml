              - integer
              - string
            format: int32
          example: 1
        - name: DictionaryId
          in: path
          description: "The dictionary's identifier.\r

            Must be a positive integer."
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
          example: 1
        - name: Type
          in: query
          description: "Optional entry type for filtering the results.\r

            Must use 0 for Word type and 1 for Phrase type."
          schema:
            $ref: "#/components/schemas/DictionaryEntryType"
          example: 0
        - name: Page
          in: query
          description: Page number.
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
