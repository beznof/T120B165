  /api/languages/{LanguageId}/dictionaries/{DictionaryId}/background-image:
    put:
      tags:
        - Dictionaries
      summary: Set the dictionary's background image.
      description: Set the dictionary's, indicated by its identifier, background image.
      parameters:
        - name: DictionaryId
          in: path
          description: "The dictionary's identifier.\r

            Must be a positive integer."
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
          example: 1
        - name: LanguageId
          in: path
          description: The language's identifier. Must be a positive integer.
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
          example: 1
      requestBody:
        description: "The background image.\r

          Required.\r

          Must not be empty.\r

          Must not exceed 5 MiB in size.\r

          Must be at least 500px wide and 500px tall.\r

          Must be in JPEG or PNG format."
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                BackgroundImage:
                  $ref: "#/components/schemas/IFormFile"
        required: true
      responses:
        "200":
          description: The background image was uploaded successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfSetDictionaryBackgroundImageOutput"
        "400":
          description: The path parameters were missing or incorrect or the uploaded image
            was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: The requested dictionary was not found in the specified language.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      tags:
        - Dictionaries
      summary: Delete the dictionary's background image.
      description: Delete the dictionary's, indicated by its identifier, background image.
