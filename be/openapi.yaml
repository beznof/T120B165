          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: The path parameters were missing or incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: The requested dictionary was not found in the specified language or
            it didn't have a background image set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/languages/{LanguageId}/dictionaries/{DictionaryId}/entries:
    get:
      tags:
        - Entries
      summary: List entries.
      description: List entries within the specified dictionary and language in
