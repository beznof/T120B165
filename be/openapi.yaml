openapi: 3.1.1
info:
  title: Languages.WebApi | v1
  version: 1.0.0
servers:
  - url: https://localhost:7169/
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register a user.
      description: Register a user by specifying a username, password, and Learner or
        Teacher role.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: The user was registered successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfRegisterOutput"
        "400":
          description: The request JSON body was malformed or field validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "409":
          description: The username was already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Log in a user.
      description: Log in using a username and password. The access and refresh tokens
        are returned in the JSON body.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: The user was logged in successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfAuthTokensOutput"
        "400":
          description: The JSON body was malformed or field validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: The username or password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh authentication tokens.
      description: Supply the current refresh token in the JSON body. The access and
        replacement refresh tokens are returned in the JSON body. The session's
        expiration remains unchanged.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: The tokens were refreshed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfAuthTokensOutput"
        "400":
          description: The JSON body was malformed or field validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: The refresh token is invalid or has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Log out a user session.
      description: Supply the current refresh token in the JSON body to revoke the
        session. Already-issued access tokens remain valid until they expire.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "200":
          description: The user was logged out successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: The JSON body was malformed or incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: The refresh token is invalid or has already been revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/languages/{LanguageId}/dictionaries:
    get:
      tags:
        - Dictionaries
      summary: List dictionaries.
      description: List dictionaries within the specified language in paginated manner
        by supplying the page size, the page number, and optionally a name
        search filter.
      parameters:
        - name: LanguageId
          in: path
          description: "The language's identifier.\r

            Must be a positive integer."
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
          example: 1
        - name: Page
          in: query
          description: Page number.
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
          example: 1
        - name: PageSize
          in: query
          description: Size of the page.
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
          example: 20
        - name: Search
          in: query
          description: Optional search term for filtering the results.
          schema:
            type: string
          example: abc
      responses:
        "200":
          description: The requested page of dictionaries was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfGetManyDictionariesOutput"
        "400":
          description: The path or query parameters were missing or incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: The requested language was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    post:
      tags:
        - Dictionaries
      summary: Create a dictionary.
      description: Create a dictionary within the specified language by specifying its
        properties.
      parameters:
        - name: LanguageId
          in: path
          description: "The language's identifier.\r

            Must be a positive integer."
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDictionaryRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateDictionaryRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateDictionaryRequest"
        required: true
      responses:
        "201":
          description: The dictionary was created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfCreateDictionaryOutput"
        "400":
          description: The path parameters were missing or incorrect or the JSON body was
            malformed or incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: The requested language was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/languages/{LanguageId}/dictionaries/{DictionaryId}:
